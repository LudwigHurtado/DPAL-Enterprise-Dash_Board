name: Diagnose DPAL Evidence Studio Health

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dpal-evidence-studio-health.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public frontend API
        shell: bash
        run: |
          set +e
          code=$(curl --silent --show-error --output /tmp/frontend-health.json --write-out '%{http_code}' https://www.dpal.info/api/deepal/media-studio)
          echo "FRONTEND_HTTP=$code"
          cat /tmp/frontend-health.json || true
          echo
      - name: Probe Railway backend API directly
        shell: bash
        run: |
          set +e
          code=$(curl --silent --show-error --output /tmp/backend-health.json --write-out '%{http_code}' https://web-production-a27b.up.railway.app/api/deepal/media-studio)
          echo "BACKEND_HTTP=$code"
          cat /tmp/backend-health.json || true
          echo
