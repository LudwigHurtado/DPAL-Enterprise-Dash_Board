name: Enable Railway FFmpeg for Evidence Studio

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/enable-railway-ffmpeg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: 2048ef16-f61f-4908-91d5-a10272b6a934
      ENVIRONMENT_ID: e0bbfc3b-876d-4694-9f56-428d87f581e4
      SERVICE_ID: 6f486eff-edf3-41af-83bf-a0b5d51bcaec
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
    steps:
      - name: Verify Railway project credential and scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_PROJECT_TOKEN"
          cat > /tmp/token-query.json <<'JSON'
          {"query":"query { projectToken { projectId environmentId } }"}
          JSON
          curl --fail --silent --show-error \
            -X POST "$RAILWAY_GRAPHQL_URL" \
            -H "Project-Access-Token: $RAILWAY_PROJECT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/token-query.json \
            -o /tmp/token-response.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/token-response.json'))
          if data.get('errors'):
              raise SystemExit(data['errors'])
          token=(data.get('data') or {}).get('projectToken') or {}
          if token.get('projectId') != os.environ['PROJECT_ID']:
              raise SystemExit(f"Token project mismatch: {token.get('projectId')}")
          if token.get('environmentId') != os.environ['ENVIRONMENT_ID']:
              raise SystemExit(f"Token environment mismatch: {token.get('environmentId')}")
          print('Railway project token scope confirmed.')
          PY

      - name: Configure Railpack runtime packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/variables-mutation.json
          import json, os
          print(json.dumps({
              'query': 'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }',
              'variables': {
                  'input': {
                      'projectId': os.environ['PROJECT_ID'],
                      'environmentId': os.environ['ENVIRONMENT_ID'],
                      'serviceId': os.environ['SERVICE_ID'],
                      'variables': {
                          'RAILPACK_BUILD_APT_PACKAGES': 'ffmpeg',
                          'RAILPACK_DEPLOY_APT_PACKAGES': 'ffmpeg',
                          'MEDIA_STUDIO_MAX_CONCURRENT_RENDERS': '1'
                      },
                      'skipDeploys': True
                  }
              }
          }))
          PY
          curl --fail --silent --show-error \
            -X POST "$RAILWAY_GRAPHQL_URL" \
            -H "Project-Access-Token: $RAILWAY_PROJECT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/variables-mutation.json \
            -o /tmp/variables-response.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/variables-response.json'))
          if data.get('errors'):
              raise SystemExit(data['errors'])
          if (data.get('data') or {}).get('variableCollectionUpsert') is not True:
              raise SystemExit('Railway did not confirm variable update.')
          print('Railpack FFmpeg variables configured.')
          PY

      - name: Trigger Railway web deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/deploy-mutation.json
          import json, os
          print(json.dumps({
              'query': 'mutation serviceInstanceDeploy($serviceId: String!, $environmentId: String!) { serviceInstanceDeploy(serviceId: $serviceId, environmentId: $environmentId) }',
              'variables': {
                  'serviceId': os.environ['SERVICE_ID'],
                  'environmentId': os.environ['ENVIRONMENT_ID']
              }
          }))
          PY
          curl --fail --silent --show-error \
            -X POST "$RAILWAY_GRAPHQL_URL" \
            -H "Project-Access-Token: $RAILWAY_PROJECT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy-mutation.json \
            -o /tmp/deploy-response.json
          DEPLOYMENT_ID=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/deploy-response.json'))
          if data.get('errors'):
              raise SystemExit(data['errors'])
          print((data.get('data') or {}).get('serviceInstanceDeploy') or '')
          PY
          )
          test -n "$DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Railway deployment started: $DEPLOYMENT_ID"

      - name: Wait for Evidence Studio renderer
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            code=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' https://web-production-a27b.up.railway.app/api/deepal/media-studio || true)
            echo "attempt=$attempt http=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          raise SystemExit(0 if data.get('rendererReady') is True else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = "1"
